
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Studio AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#f5f5f7;font:16px system-ui,sans-serif;padding:20px;max-width:760px;margin:auto}
h1{font-size:27px;margin:8px 0}
p{color:#b8b9c5;line-height:1.5}
.panel{background:#1c1d26;border:1px solid #343543;border-radius:16px;padding:16px;margin:16px 0}
label{display:block;margin:13px 0 7px;font-weight:600}
input,textarea,button{font:inherit;width:100%;border-radius:10px;padding:12px}
input,textarea{background:#11121a;color:white;border:1px solid #454657}
input[type=file]{padding:10px}
button{background:#7765ff;color:white;border:0;font-weight:700;margin-top:12px}
button:disabled{opacity:.5}
#stage{position:relative;width:100%;margin-top:14px;touch-action:none}
#photo{display:block;width:100%;height:auto;border-radius:10px}
#mask{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:10px}
.row button{flex:1}
small{color:#b8b9c5}
</style>
</head>
<body>
<h1>Photo Studio AI</h1>
<p>Wybierz zdjęcie, zaznacz pędzlem obszar do zmiany i wpisz opis.</p>

<div class="panel">
<label for="photoFile">1. Wybierz zdjęcie</label>
<input id="photoFile" type="file" accept="image/*">

<div id="stage" hidden>
<img id="photo" alt="Podgląd zdjęcia">
<canvas id="mask"></canvas>
</div>

<div class="row">
<button id="clearMask" type="button">Wyczyść maskę</button>
<button id="toggleBrush" type="button">Pędzel: włączony</button>
</div>

<label for="brushSize">Rozmiar pędzla</label>
<input id="brushSize" type="range" min="5" max="100" value="30">
<small>Zamaluj obszar, który AI ma zmienić.</small>
</div>

<div class="panel">
<label for="worker">2. Adres Workera</label>
<input id="worker" type="url"
value="https://tight-water-d294.c87dwd55fw.workers.dev"
autocomplete="url">

<label for="password">Hasło aplikacji</label>
<input id="password" type="password" autocomplete="off"
placeholder="Hasło APP_PASSWORD">

<label for="prompt">3. Opisz zmianę</label>
<textarea id="prompt" rows="3"
placeholder="Np. zmień kolor kurtki na zielony"></textarea>

<button id="edit" type="button">Edytuj zdjęcie przez AI</button>
<p id="status" role="status">Wybierz zdjęcie, aby rozpocząć.</p>
<div id="resultBox" hidden>
<h2>Wynik</h2>
<img id="result" alt="Wynik edycji"
style="display:block;width:100%;border-radius:10px">
<a id="download" download="photo-edited.png">Pobierz wynik</a>
</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let file = null;
let imageURL = null;
let brushOn = true;
let drawing = false;

const photo = $("photo");
const canvas = $("mask");
const ctx = canvas.getContext("2d");

function status(message) {
  $("status").textContent = message;
}

function clearMask() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

$("photoFile").addEventListener("change", async event => {
  const selected = event.target.files && event.target.files[0];
  if (!selected) return;

  if (!selected.type.startsWith("image/")) {
    status("Wybierz plik obrazu.");
    return;
  }

  file = selected;
  status("Wczytuję zdjęcie…");

  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(file);

  photo.onload = () => {
    canvas.width = photo.naturalWidth;
    canvas.height = photo.naturalHeight;
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    $("stage").hidden = false;
    clearMask();
    $("resultBox").hidden = true;
    status("Zdjęcie wczytane. Zaznacz obszar do zmiany.");
  };

  photo.onerror = () => {
    status("Nie udało się odczytać zdjęcia. Spróbuj wybrać JPG lub PNG.");
  };

  photo.src = imageURL;
});

function point(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

canvas.addEventListener("pointerdown", event => {
  if (!brushOn || !file) return;
  event.preventDefault();
  drawing = true;
  canvas.setPointerCapture(event.pointerId);
  const p = point(event);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(255,45,85,0.75)";
  ctx.lineWidth = Number($("brushSize").value) *
    canvas.width / canvas.getBoundingClientRect().width;
  ctx.lineTo(p.x + 0.1, p.y + 0.1);
  ctx.stroke();
});

canvas.addEventListener("pointermove", event => {
  if (!drawing) return;
  event.preventDefault();
  const p = point(event);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

function stopDrawing() {
  drawing = false;
  ctx.beginPath();
}
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

$("clearMask").addEventListener("click", clearMask);

$("toggleBrush").addEventListener("click", () => {
  brushOn = !brushOn;
  $("toggleBrush").textContent =
    "Pędzel: " + (brushOn ? "włączony" : "wyłączony");
  canvas.style.pointerEvents = brushOn ? "auto" : "none";
});

$("edit").addEventListener("click", async () => {
  if (!file) {
    status("Najpierw wybierz zdjęcie.");
    return;
  }

  const prompt = $("prompt").value.trim();
  const worker = $("worker").value.trim().replace(/\/+$/, "");
  const password = $("password").value;

  if (!prompt) {
    status("Wpisz opis zmiany.");
    return;
  }
  if (!password) {
    status("Wpisz hasło aplikacji.");
    return;
  }

  $("edit").disabled = true;
  $("resultBox").hidden = true;
  status("Wysyłam zdjęcie do AI…");

  try {
    const maskBlob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/png")
    );

    if (!maskBlob) throw new Error("Nie udało się przygotować maski.");

    const form = new FormData();
    form.append("image", file, file.name);
    form.append("mask", maskBlob, "mask.png");
    form.append("prompt", prompt);

    const response = await fetch(worker + "/edit", {
      method: "POST",
      headers: { "X-App-Password": password },
      body: form
    });

    if (!response.ok) {
      const message = await response.text();
      throw new Error("HTTP " + response.status + ": " + message);
    }

    const blob = await response.blob();
    if (!blob.type.startsWith("image/")) {
      throw new Error("Serwer nie zwrócił pliku obrazu.");
    }

    const url = URL.createObjectURL(blob);
    $("result").src = url;
    $("download").href = url;
    $("resultBox").hidden = false;
    status("Gotowe. Możesz obejrzeć i pobrać wynik.");
  } catch (error) {
    status("Błąd: " + (error.message || error) +
      "\nSprawdź adres Workera, hasło i jego logi.");
  } finally {
    $("edit").disabled = false;
  }
});
</script>
</body>
</html>
